name: validate-skills

on:
  push:
    branches: [main]
  pull_request:

# The job only reads the checkout and runs validators. Without this block the
# workflow inherits the repository default, which on a write-enabled repository
# hands a read-write GITHUB_TOKEN to every step — including the build code of
# the third-party validator installed below.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install validation and test dependencies
        run: pip install -r requirements-dev.txt
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        # Loose mode, and non-blocking on purpose. Type coverage is a ratchet,
        # not a gate: it should surface regressions without turning a first
        # contribution into a typing exercise. Tighten once the suite settles.
        continue-on-error: true
        run: mypy tools/
      - name: Validate all skills
        run: python tools/validate_skills.py
      - name: Validate evaluation suite
        run: python tools/validate_evals.py
      - name: Check regression gates
        # Behaviour and routing quality can only be measured by paid model runs,
        # so CI cannot re-measure them here. These gates block the two ways
        # quality degrades silently between runs: deleting the criterion that was
        # failing, and leaving a stale benchmark presenting itself as current.
        run: python tools/check_regression_gates.py
      - name: Install official Agent Skills reference validator
        run: >-
          pip install
          "git+https://github.com/agentskills/agentskills.git@38a2ff82958afee88dadf4831509e6f7e9d8ef4e#subdirectory=skills-ref"
      - name: Validate against the official Agent Skills specification
        shell: bash
        run: |
          set -euo pipefail
          for skill in skills/*; do
            skills-ref validate "$skill"
          done
      - name: Test bundled scripts
        run: python -m pytest

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test bundled scripts on Windows
        run: python -m pytest

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test bundled scripts on macOS
        run: python -m pytest
